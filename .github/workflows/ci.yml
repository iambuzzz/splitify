name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 = maintenance LTS (until 2027-04-30), 24 = maintenance LTS (until 2028-04-30).
        # Add 26 once it enters LTS on 2026-10-28.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck -w @app/client
      - run: npm run coverage
      - run: npm run audit  # npm audit + reviewed allowlist (audit-allowlist.json)

  # Races and the API suite on a real Postgres (PGlite has a single connection).
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: postgres  # throwaway CI database, not a secret
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:pg
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
